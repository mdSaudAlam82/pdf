name: Hi-Read Ultimate CI/CD (2026 Edition)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21 (Zulu)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu' # Aapka favourite and stable distribution
          cache: gradle

      # 🌟 THE CRITICAL FIX: Permission denied (Exit 126) ko khatam karne ke liye
      - name: 🔨 Grant execute permission for gradlew
        run: chmod +x gradlew

      # 🌟 Step 1: Code Quality Check (Android Default Lint)
      # Ye ensure karega ki architecture aur performance mein koi issue na ho
      - name: 🔍 Run Quality Lint
        run: ./gradlew lint

      # 🌟 Step 2: Debug Build (For instant testing)
      - name: 🛠️ Build Debug APK
        run: ./gradlew assembleDebug

      # 🌟 Step 3: Release Build (For performance bench-marking)
      - name: 🚀 Build Release APK
        run: ./gradlew assembleRelease

      # 🌟 Step 4: Dono APKs ko ek saath upload karna
      - name: 📦 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hi-Read-Build-Package
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk