name: Hi-Read Elite CI/CD (2026 Production)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Release Elite APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # 🌟 CRITICAL: Release create karne ke liye permission chahiye

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 21 (Zulu)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: 🔨 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🔍 Run Static Analysis (Detekt & Lint)
        run: ./gradlew lint --continue || true # 🌟 Build nahi rokega par report dega

      - name: 🚀 Build Release APK
        run: ./gradlew assembleRelease
        env:
          # 🌟 Gradle ko secrets pass kar sakte hain agar build.gradle configured ho
          # Abhi hum manually sign karenge niche wale step mein
          JAVA_OPTS: "-Xmx4g"

      - name: 🔐 Elite Signing (Production Ready)
        if: github.event_name != 'pull_request'
        id: sign_app
        run: |
          # 1. Base64 encoded Keystore ko decode karke file banate hain
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
          
          # 2. Build tools ka path nikalte hain
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | tail -1)
          
          # 3. Zipalign (RAM optimization)
          $BUILD_TOOLS_DIR/zipalign -v 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          
          # 4. Asli Keystore se Sign karna
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out Hi-Read-Elite-v2026.apk app-release-aligned.apk
          
          echo "signed_apk=Hi-Read-Elite-v2026.apk" >> $GITHUB_OUTPUT

      - name: 📦 Create GitHub Release (Zero-ZIP Delivery)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Elite Build #${{ github.run_number }}
          body: |
            ## 🚀 New Production-Ready Build
            - Built from: `${{ github.sha }}`
            - **Direct Download**: Neeche di gayi APK file download karein.
            - **No ZIP**: Seedha installable file.
          files: Hi-Read-Elite-v2026.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Notify Failure
        if: failure()
        run: echo "Build failed! Check the logs for errors."
