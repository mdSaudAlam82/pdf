name: Android CI/CD Pipeline

# Jab bhi 'main' branch par code push hoga ya Pull Request aayegi, ye trigger hoga
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub aapka code checkout karega
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Kotlin 2.x aur API 36 ke liye Java 21 standard hai
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle setup (jisse build fast ho)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      # 4. Code Formatting Check (Detekt/Ktlint)
      # Ye ensure karega ki koi bhi developer kharab format me code push na kare
      - name: Run Code Linter
        run: ./gradlew lintKotlin

      # 5. Debug APK Build Karna
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. APK ko GitHub par upload karna taaki koi bhi direct download karke test kar sake
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hi-Read-App-Debug
          path: app/build/outputs/apk/debug/app-debug.apk